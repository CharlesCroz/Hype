---
partitions:
  - name: term
    id: 0
    descr: "Terminal for user interaction"
    mmap:
      len:      0x100000
      pa_start: 0x200000
    permissions:
      - uart_recv
      - uart_send
      - time_get

  - name: blinky
    id: 1
    descr: "Periodically blinks LEDs"
    mmap:
      len:      0x100000
      pa_start: 0x300000
    permissions:
      - uart_send
      - time_get
      - led_write

  - name: pushy
    id: 2
    descr: "When a button has been pressed, prints something (for now, just blink...)"
    mmap:
      len:      0x100000
      pa_start: 0x400000
    permissions:
      - uart_send
      - time_get
      - led_write

schedule:
  period_ms: 50
  cpu0:
    - from_ms: 0
      to_ms: 30
      partition: 0
    - from_ms: 30
      to_ms: 40
      partition: 1
    - from_ms: 40
      to_ms: 50
      partition: 2

