---
partitions:
  - name: term
    id: 0
    descr: "Terminal for user interaction"
    mmap:
      len:      0x100000
      pa_start: 0x200000
    permissions:
      - uart_receive
      - uart_send
      - get_time

  - name: blinky
    id: 1
    descr: "Periodically blinks LEDs"
    mmap:
      len:      0x100000
      pa_start: 0x1000000
    permissions:
      - get_time

  - name: pushy
    id: 2
    descr: "When a button has been pressed, prints something"
    mmap:
      len:      0x100000
      pa_start: 0x1100000
    permissions:
      - uart_send
      - btn_read

